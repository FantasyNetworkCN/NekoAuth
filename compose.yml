services:
  auth:
    build: .
    image: nekoauth:local
    network_mode: host
    user: "${NEKO_UID:-1000}:${NEKO_GID:-1000}"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "65534"
      AUTH_SETUP_ENABLED: "false"
      AUTH_SETUP_STATE_DIR: /app/data
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_DOMAIN: ${NEKO_COOKIE_DOMAIN:-nekocore.cn}
      OAUTH_ISSUER: ${NEKO_OAUTH_ISSUER:-https://auth.nekocore.cn}
      SPRING_APPLICATION_JSON: >-
        {"auth":{"cors":{"allowed-origins":["${NEKO_CORS_ORIGIN:-https://auth.nekocore.cn}"]}}}
    volumes:
      - nekoauth_data:/app/data
    restart: unless-stopped

volumes:
  nekoauth_data:
    external: true
    name: nekoauth_data
