services:
  secrets-init:
    image: alpine:3.21
    command: ["/bin/sh", "/scripts/docker-secrets-init.sh"]
    environment:
      NEKO_ADMIN_PASSWORD: ${NEKO_ADMIN_PASSWORD:-}
    volumes:
      - ./scripts/docker-secrets-init.sh:/scripts/docker-secrets-init.sh:ro
      - ./config:/bootstrap-config:ro
      - auth-secrets:/run/secrets
    restart: "no"

  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: nekoauth
      MYSQL_USER: nekoauth
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    volumes:
      - mysql-data:/var/lib/mysql
      - auth-secrets:/run/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$(cat /run/secrets/db_password)\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth:
    build: .
    ports:
      - "65534:65534"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NEKO_ADMIN_USERNAME: ${NEKO_ADMIN_USERNAME:-admin}
      NEKO_ADMIN_EMAIL: ${NEKO_ADMIN_EMAIL:-support@nekocore.cn}
      NEKO_OAUTH_ISSUER: ${NEKO_OAUTH_ISSUER:-https://auth.nekocore.cn}
      NEKO_CORS_ORIGIN: ${NEKO_CORS_ORIGIN:-https://auth.nekocore.cn}
      NEKO_COOKIE_SECURE: ${NEKO_COOKIE_SECURE:-true}
    volumes:
      - ./config:/app/config:ro
      - nekoauth-data:/app/data
      - auth-secrets:/run/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  nekoauth-data:
  auth-secrets:
