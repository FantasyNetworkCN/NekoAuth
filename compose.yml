services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: nekoauth
      MYSQL_USER: nekoauth
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - db_password
      - mysql_root_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$(cat /run/secrets/db_password)\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth:
    build: .
    ports:
      - "65534:65534"
    secrets:
      - db_password
      - jwt_secret
      - admin_password
    volumes:
      - ./config:/app/config:ro
      - nekoauth-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  nekoauth-data:

secrets:
  db_password:
    file: ./config/secrets/db_password
  jwt_secret:
    file: ./config/secrets/jwt_secret
  admin_password:
    file: ./config/secrets/admin_password
  mysql_root_password:
    file: ./config/secrets/mysql_root_password
