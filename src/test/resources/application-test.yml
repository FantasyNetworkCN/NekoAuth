spring:
  datasource:
    url: jdbc:h2:mem:nekoauth_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

auth:
  bootstrap-admin:
    username: admin
    email: admin@example.com
    password: AdminPass123
  rate-limit:
    attempts: 100
    window: 5m
  registration:
    require-email-verification: false
  setup:
    state-dir: target/test-setup-state
    token: test-setup-token
    enabled: true

oauth:
  issuer: https://auth.fantasy.example
  key-file: target/test-oauth-signing-key.pem
  bridge-token-ttl: 365d

avatar:
  directory: target/test-avatars
  max-bytes: 10485760
