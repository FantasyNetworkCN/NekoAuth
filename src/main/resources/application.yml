server:
  port: ${PORT:65534}
  forward-headers-strategy: framework
  compression:
    enabled: true

spring:
  application:
    name: neko-auth
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/nekoauth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  data:
    redis:
      repositories:
        enabled: false
  web:
    resources:
      static-locations: classpath:/site/

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:dev-only-change-me-nekoauth-secret-key-please-use-env-2026}
    issuer: ${AUTH_JWT_ISSUER:neko-auth}
    access-ttl: ${AUTH_ACCESS_TTL:15m}
    refresh-ttl: ${AUTH_REFRESH_TTL:14d}
  cookie:
    name: refresh_token
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    username: ${AUTH_ADMIN_USERNAME:}
    email: ${AUTH_ADMIN_EMAIL:}
    display-name: ${AUTH_ADMIN_DISPLAY_NAME:Neko Admin}
    password: ${AUTH_ADMIN_PASSWORD:}
  rate-limit:
    attempts: ${AUTH_LOGIN_ATTEMPTS:20}
    window: ${AUTH_LOGIN_WINDOW:5m}
  setup:
    state-dir: ${AUTH_SETUP_STATE_DIR:./data}
    token: ${AUTH_SETUP_TOKEN:}

oauth:
  issuer: ${AUTH_OAUTH_ISSUER:http://localhost:65534}
  key-file: ${AUTH_OAUTH_KEY_FILE:${AUTH_SETUP_STATE_DIR:./data}/oauth-signing-key.pem}
  authorization-code-ttl: ${AUTH_OAUTH_CODE_TTL:5m}
  access-token-ttl: ${AUTH_OAUTH_ACCESS_TTL:1h}
  id-token-ttl: ${AUTH_OAUTH_ID_TTL:10m}
  refresh-token-ttl: ${AUTH_OAUTH_REFRESH_TTL:30d}

logging:
  level:
    neko.fantasy.auth: INFO
