server:
  port: 65534
  forward-headers-strategy: framework
  compression:
    enabled: true

spring:
  application:
    name: neko-auth
  datasource:
    url: jdbc:h2:file:./data/nekoauth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  data:
    redis:
      repositories:
        enabled: false
  web:
    resources:
      static-locations: classpath:/site/

auth:
  jwt:
    secret: dev-only-change-me-nekoauth-secret-key-please-configure-2026
    issuer: neko-auth
    access-ttl: 15m
    refresh-ttl: 14d
  cookie:
    name: refresh_token
    secure: false
    same-site: Strict
  cors:
    allowed-origins: http://localhost:5173
  bootstrap-admin:
    username:
    email:
    display-name: Neko Admin
    password:
  rate-limit:
    attempts: 20
    window: 5m
  setup:
    state-dir: ./data
    token:
    enabled: true

oauth:
  issuer: http://localhost:65534
  key-file: ./data/oauth-signing-key.pem
  authorization-code-ttl: 5m
  access-token-ttl: 1h
  id-token-ttl: 10m
  refresh-token-ttl: 30d

logging:
  level:
    neko.fantasy.auth: INFO
