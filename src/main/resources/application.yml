server:
  port: 65534
  forward-headers-strategy: framework
  compression:
    enabled: false

spring:
  application:
    name: neko-auth
  datasource:
    url: jdbc:h2:mem:nekoauth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  data:
    redis:
      repositories:
        enabled: false
  web:
    resources:
      static-locations: classpath:/site/

auth:
  jwt:
    secret: dev-only-change-me-nekoauth-secret-key-please-configure-2026
    issuer: neko-auth
    access-ttl: 15m
    refresh-ttl: 14d
  cookie:
    name: refresh_token
    secure: false
    same-site: Strict
  cors:
    allowed-origins:
      - http://localhost:5173
      - https://auth.nekocore.cn
  bootstrap-admin:
    username:
    email:
    password:
  rate-limit:
    attempts: 20
    window: 5m
  registration:
    require-email-verification: true
    email-code-ttl: 10m
    email-code-cooldown: 60s
    email-code-daily-limit: 5
    email-code-window: 24h
    captcha-ttl: 5m
  setup:
    state-dir: ./data
    token:
    enabled: true

oauth:
  issuer: https://auth.nekocore.cn
  key-file: ./data/oauth-signing-key.pem
  authorization-code-ttl: 5m
  access-token-ttl: 1h
  id-token-ttl: 10m
  refresh-token-ttl: 30d

logging:
  level:
    neko.fantasy.auth: ${NEKO_LOG_LEVEL:INFO}
    com.zaxxer.hikari: WARN
    org.hibernate: WARN
