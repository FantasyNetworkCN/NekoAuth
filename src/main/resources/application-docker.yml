spring:
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: jdbc:mysql://mysql:3306/nekoauth?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=5000&allowPublicKeyRetrieval=true&sslMode=PREFERRED
    username: nekoauth
    password: ${db_password}
  data:
    redis:
      host: redis
      port: 6379
      database: 0

auth:
  jwt:
    secret: ${jwt_secret}
  cookie:
    secure: ${NEKO_COOKIE_SECURE:true}
  cors:
    allowed-origins:
      - ${NEKO_CORS_ORIGIN:https://auth.nekocore.cn}
  bootstrap-admin:
    username: ${NEKO_ADMIN_USERNAME:admin}
    email: ${NEKO_ADMIN_EMAIL:support@nekocore.cn}
    password: ${admin_password}
  setup:
    enabled: false
    state-dir: /app/data

oauth:
  issuer: ${NEKO_OAUTH_ISSUER:https://auth.nekocore.cn}
  key-file: /app/data/oauth-signing-key.pem
